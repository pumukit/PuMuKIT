services:
  php:
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ./
      target: production
      cache_from:
        - teltek/pumukit
        - teltek/nginx
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      # Uncomment the next lines in production
      # - ./public/storage:/srv/pumukit/public/storage:rw,cached
      # - ./public/uploads:/srv/pumukit/public/uploads:rw,cached
      # Uncomment the next line for dev
      - ./:/srv/pumukit

  proxy:
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ./
      target: proxy
      cache_from:
        - teltek/pumukit
        - teltek/nginx
    depends_on:
      - php
    volumes:
      # Uncomment the next lines in production
      # - ./public/storage:/srv/pumukit/public/storage:rw,cached
      # - ./public/uploads:/srv/pumukit/public/uploads:rw,cached
      # Uncomment the next line for dev
      - ./:/srv/pumukit
    ports:
      - "80:80"
      - "443:443"

  db:
    image: mongo:9.0
    restart: unless-stopped
    volumes:
      - db-data:/data/db:rw

  redis:
    image: valkey/valkey:9.1
    restart: unless-stopped
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:4.4-management
    hostname: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:rw

volumes:
  db-data: {}
  rabbitmq-data: {}

