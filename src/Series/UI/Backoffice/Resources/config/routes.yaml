series_create:
  path: /admin/backend/series/new
  controller: App\Series\UI\Backoffice\Controller\CreateSeriesController

series_list:
  path: /admin/backend/series
  controller: App\Series\UI\Backoffice\Controller\ListSeriesController

series_list_data:
  path: /admin/backend/series/data
  controller: App\Series\UI\Backoffice\Controller\ListSeriesDataController

# Bulk operations first
series_bulk_delete:
  path: /admin/backend/series/bulk/delete
  controller: App\Series\UI\Backoffice\Controller\BulkDeleteSeriesController
  methods: [POST]

series_bulk_toggle_announce:
  path: /admin/backend/series/bulk/toggle-announce
  controller: App\Series\UI\Backoffice\Controller\BulkToggleAnnounceSeriesController
  methods: [POST]

series_multimedia_object_data:
  path: /admin/backend/series/{id}/multimedia/data
  controller: App\Series\UI\Backoffice\Controller\ViewSeriesMultimediaObjectsDataController

series_events_data:
  path: /admin/backend/series/{id}/events/data
  controller: App\Series\UI\Backoffice\Controller\ViewSeriesEventsDataController

series_delete:
  path: /admin/backend/series/{id}/delete
  controller: App\Series\UI\Backoffice\Controller\DeleteSeriesController

series_clone:
  path: /admin/backend/series/{id}/clone
  controller: App\Series\UI\Backoffice\Controller\CloneSeriesController
  methods: [POST]

series_update:
  path: /admin/backend/series/{id}/update
  controller: App\Series\UI\Backoffice\Controller\UpdateSeriesController
  methods: [POST]

# Generic view route MUST be last to avoid conflicts
series_view:
  path: /admin/backend/series/{id}/{tab}
  controller: App\Series\UI\Backoffice\Controller\ViewSeriesController
  defaults:
    tab: 'general'
  requirements:
    tab: '[a-zA-Z0-9_-]+'

