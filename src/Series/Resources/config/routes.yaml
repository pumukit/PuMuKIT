series_create:
  path: /admin/backend/series/new
  controller: App\Series\UI\Backend\Controller\CreateSeriesController

series_list:
  path: /admin/backend/series
  controller: App\Series\UI\Backend\Controller\ListSeriesController

series_list_data:
  path: /admin/backend/series/data
  controller: App\Series\UI\Backend\Controller\ListSeriesDataController

series_view:
  path: /admin/backend/series/{id}/{tab}
  controller: App\Series\UI\Backend\Controller\ViewSeriesController
  defaults:
    tab: 'general'
  requirements:
    tab: '[a-zA-Z0-9_-]+'  # Allow any alphanumeric tab name (core + dynamic tabs)

series_multimedia_data:
  path: /admin/backend/series/{id}/multimedia/data
  controller: App\Series\UI\Backend\Controller\ViewSeriesMultimediaObjectsDataController

series_events_data:
  path: /admin/backend/series/{id}/events/data
  controller: App\Series\UI\Backend\Controller\ViewSeriesEventsDataController

series_delete:
  path: /admin/backend/series/{id}/delete
  controller: App\Series\UI\Backend\Controller\DeleteSeriesController
  methods: [POST]

series_clone:
  path: /admin/backend/series/{id}/clone
  controller: App\Series\UI\Backend\Controller\CloneSeriesController
  methods: [POST]

series_update:
  path: /admin/backend/series/{id}/update
  controller: App\Series\UI\Backend\Controller\UpdateSeriesController
  methods: [POST]
