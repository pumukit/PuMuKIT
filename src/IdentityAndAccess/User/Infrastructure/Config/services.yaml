services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # --- DOMAIN & APPLICATION ---
  App\IdentityAndAccess\User\Application\:
    resource: '../../Application/'
    exclude: '../../Application/**/*{Query,Request,Response,Validator}.php'

  # --- INFRASTRUCTURE: PERSISTENCE ---
  App\IdentityAndAccess\User\Infrastructure\Persistence\DoctrineUserRepository:
    tags: ['doctrine.repository']

  App\IdentityAndAccess\User\Domain\Repository\UserRepositoryInterface:
    alias: App\IdentityAndAccess\User\Infrastructure\Persistence\DoctrineUserRepository

  App\IdentityAndAccess\User\Infrastructure\:
    resource: '../'
    exclude: '../{Config,Ui,Persistence}'

  # --- INFRASTRUCTURE: UI ---
  App\IdentityAndAccess\User\Infrastructure\Ui\Backoffice\Http\Controller\:
    resource: '../Ui/Backoffice/Http/Controller/'
    tags: ['controller.service_arguments']

  App\IdentityAndAccess\User\Infrastructure\Ui\Backoffice\Http\Presenter\:
    resource: '../Ui/Backoffice/Http/Presenter/'

  App\IdentityAndAccess\User\Infrastructure\Ui\Backoffice\Http\EventSubscriber\:
    resource: '../Ui/Backoffice/Http/EventSubscriber/'
