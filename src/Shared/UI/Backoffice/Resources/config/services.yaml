services:
  App\Shared\Infrastructure\EventBus: ~

  App\Shared\Domain\EventBusInterface:
    alias: App\Shared\Infrastructure\EventBus

  # Logger adapter from PSR-3 to our domain interface
  App\Shared\Infrastructure\Logger\PsrLoggerAdapter:
    arguments:
      $psrLogger: '@monolog.logger'

  App\Shared\Domain\LoggerInterface:
    alias: App\Shared\Infrastructure\Logger\PsrLoggerAdapter

  App\Shared\UI\Backoffice\Twig\LocaleExtension:
    tags:
      - { name: twig.extension }

  # Menu System
  App\Shared\UI\Backoffice\Menu\MenuBuilder:
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $urlGenerator: '@router'
      $authorizationChecker: '@security.authorization_checker'
      $requestStack: '@request_stack'

  App\Shared\UI\Backoffice\Menu\MenuExtension:
    arguments:
      $menuBuilder: '@App\Shared\UI\Backoffice\Menu\MenuBuilder'
    tags:
      - { name: twig.extension }

  # Menu Event Subscribers
  App\Shared\UI\Backoffice\Menu\EventSubscriber\:
    resource: '../../Menu/EventSubscriber'
    tags:
      - { name: kernel.event_subscriber }

  # Header System
  App\Shared\UI\Backoffice\Header\HeaderBuilder:
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $urlGenerator: '@router'
      $authorizationChecker: '@security.authorization_checker'

  App\Shared\UI\Backoffice\Header\HeaderExtension:
    arguments:
      $headerBuilder: '@App\Shared\UI\Backoffice\Header\HeaderBuilder'
    tags:
      - { name: twig.extension }

  # Header Event Subscribers
  App\Shared\UI\Backoffice\Header\EventSubscriber\:
    resource: '../../Header/EventSubscriber'
    tags:
      - { name: kernel.event_subscriber }

