# List routes
multimedia_objects_list:
  path: /admin/backend/multimedia-objects
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\ListMultimediaObjectsController
  methods: [GET]

multimedia_objects_list_data:
  path: /admin/backend/multimedia-objects/data
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\ListMultimediaObjectsDataController
  methods: [GET]

# Bulk operations (must be before {id} routes)
multimedia_object_bulk_delete:
  path: /admin/backend/multimedia-object/bulk/delete
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\BulkDeleteMultimediaObjectController
  methods: [POST]

multimedia_object_bulk_toggle_announce:
  path: /admin/backend/multimedia-object/bulk/toggle-announce
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\BulkToggleAnnounceMultimediaObjectController
  methods: [POST]

# Routes with {id} parameter (must be after bulk operations)
multimedia_object_view:
  path: /admin/backend/multimedia-object/{id}/{tab}
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\ViewMultimediaObjectController
  defaults:
    tab: 'general'
  requirements:
    tab: general|media|metadata|owners|people|publication|tags

multimedia_object_delete:
  path: /admin/backend/multimedia-object/{id}/delete
  controller: App\ContentManagement\MultimediaObject\Infrastructure\Ui\Backoffice\Http\Controller\DeleteMultimediaObjectController
  methods: [POST]
