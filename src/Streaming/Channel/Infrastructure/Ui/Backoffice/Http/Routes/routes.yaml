backoffice_streaming_channels_list:
  path: /admin/backend/streaming/channels
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\ListChannelsController
  methods: [GET]

backoffice_streaming_channels_list_data:
  path: /admin/backend/streaming/channels/data
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\ListChannelsDataController
  methods: [GET]

backoffice_streaming_channel_view:
  path: /admin/backend/streaming/channels/{id}
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\ViewChannelController
  methods: [GET]

backoffice_streaming_channel_create:
  path: /admin/backend/streaming/channels/new
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\CreateChannelController
  methods: [GET, POST]

backoffice_streaming_channel_edit:
  path: /admin/backend/streaming/channels/{id}/edit
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\UpdateChannelController
  methods: [GET, POST]

backoffice_streaming_channel_delete:
  path: /admin/backend/streaming/channels/{id}/delete
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\DeleteChannelController
  methods: [POST]

backoffice_streaming_channels_bulk_delete:
  path: /admin/backend/streaming/channels/bulk/delete
  controller: App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\BulkDeleteChannelController
  methods: [POST]

