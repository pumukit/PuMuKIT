services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # --- DOMAIN & APPLICATION ---
  App\Streaming\Channel\Application\:
    resource: '../../Application/'
    exclude: '../../Application/**/*{Query,Request,Response,Validator}.php'

  # --- INFRASTRUCTURE: PERSISTENCE & OTHERS ---
  App\Streaming\Channel\Infrastructure\:
    resource: '../'
    exclude:
      - '../Config/'
      - '../Ui/'

  # --- REPOSITORIES ---
  App\Streaming\Channel\Domain\Repository\ChannelRepositoryInterface:
    alias: App\Streaming\Channel\Infrastructure\Persistence\DoctrineChannelRepository

  # --- INFRASTRUCTURE: UI ---
  App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Controller\:
    resource: '../Ui/Backoffice/Http/Controller/'
    tags: ['controller.service_arguments']

  App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\Presenter\:
    resource: '../Ui/Backoffice/Http/Presenter/'

  App\Streaming\Channel\Infrastructure\Ui\Backoffice\Http\EventSubscriber\:
    resource: '../Ui/Backoffice/Http/EventSubscriber/'


  # --- INFRASTRUCTURE: PERMISSION ---
  App\Streaming\Channel\Infrastructure\Security\Permission\StreamingPermissionRegister:
    tags: [ 'pumukit.permission_register' ]
