services:
  # EventBus adapter from Symfony to our domain interface
  App\Shared\Infrastructure\EventBus\SymfonyEventBus: ~

  App\Shared\Domain\EventBusInterface:
    alias: App\Shared\Infrastructure\EventBus\SymfonyEventBus

  # Logger adapter from PSR-3 to our domain interface
  App\Shared\Infrastructure\Logger\PsrLoggerAdapter:
    arguments:
      $psrLogger: '@monolog.logger'

  App\Shared\Domain\LoggerInterface:
    alias: App\Shared\Infrastructure\Logger\PsrLoggerAdapter

  # Translator adapter from Symfony to our domain interface
  App\Shared\Infrastructure\Translation\SymfonyTranslator:
    arguments:
      $symfonyTranslator: '@translator'

  App\Shared\Domain\TranslatorInterface:
    alias: App\Shared\Infrastructure\Translation\SymfonyTranslator

  # ObjectManager adapter from Doctrine ODM to our domain interface
  App\Shared\Infrastructure\Persistence\DoctrineObjectManager:
    arguments:
      $documentManager: '@doctrine_mongodb.odm.document_manager'

  App\Shared\Domain\ObjectManagerInterface:
    alias: App\Shared\Infrastructure\Persistence\DoctrineObjectManager

  App\UI\Backoffice\Shared\Twig\LocaleExtension:
    tags:
      - { name: twig.extension }

  # Menu System
  App\UI\Backoffice\Shared\Menu\MenuBuilder:
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $urlGenerator: '@router'
      $authorizationChecker: '@security.authorization_checker'
      $requestStack: '@request_stack'

  App\UI\Backoffice\Shared\Menu\MenuExtension:
    arguments:
      $menuBuilder: '@App\UI\Backoffice\Shared\Menu\MenuBuilder'
    tags:
      - { name: twig.extension }

  # Menu Event Subscribers
  App\UI\Backoffice\Shared\Menu\EventSubscriber\:
    resource: '../../UI/Backoffice/Shared/Menu/EventSubscriber'
    tags:
      - { name: kernel.event_subscriber }

  # Header System
  App\UI\Backoffice\Shared\Header\HeaderBuilder:
    arguments:
      $eventDispatcher: '@event_dispatcher'
      $urlGenerator: '@router'
      $authorizationChecker: '@security.authorization_checker'

  App\UI\Backoffice\Shared\Header\HeaderExtension:
    arguments:
      $headerBuilder: '@App\UI\Backoffice\Shared\Header\HeaderBuilder'
    tags:
      - { name: twig.extension }

  # Header Event Subscribers
  App\UI\Backoffice\Shared\Header\EventSubscriber\:
    resource: '../../UI/Backoffice/Shared/Header/EventSubscriber'
    tags:
      - { name: kernel.event_subscriber }

