services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\ContentManagement\Taxonomy\Domain\Repository\TagRepositoryInterface:
        class: App\ContentManagement\Taxonomy\Infrastructure\Persistence\DoctrineTagRepository

    App\ContentManagement\Taxonomy\Application\CreateTag\CreateTagService: ~
    App\ContentManagement\Taxonomy\Application\UpdateTag\UpdateTagService: ~
    App\ContentManagement\Taxonomy\Application\ViewTag\ViewTagService: ~
    App\ContentManagement\Taxonomy\Application\ListTags\ListTagsService: ~
    App\ContentManagement\Taxonomy\Application\DeleteTag\DeleteTagService: ~

    App\ContentManagement\Taxonomy\Infrastructure\Persistence\DoctrineTagRepository: ~

    App\UI\Backoffice\ContentManagement\Taxonomy\Controller\:
        resource: '../../../UI/Backoffice/ContentManagement/Taxonomy/Controller'
        tags: ['controller.service_arguments']

    App\UI\Backoffice\ContentManagement\Taxonomy\Presenter\TagDataTablePresenter: ~

    App\UI\Backoffice\ContentManagement\Taxonomy\EventSubscriber\:
        resource: '../../../UI/Backoffice/ContentManagement/Taxonomy/EventSubscriber'
        tags: [ 'kernel.event_subscriber' ]
        autowire: true
        autoconfigure: true

    App\ContentManagement\Taxonomy\Infrastructure\EventSubscriber\TagEventSubscriber:
        tags: [ 'kernel.event_subscriber' ]
        autowire: true
        autoconfigure: true

