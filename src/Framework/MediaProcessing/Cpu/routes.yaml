media_processing_cpus_list:
  path: /admin/backend/cpus
  controller: App\UI\Backoffice\MediaProcessing\Controller\ListCpusController
  methods: [GET]

media_processing_cpu_toggle_maintenance:
  path: /admin/backend/cpus/{cpuName}/maintenance/{action}
  controller: App\UI\Backoffice\MediaProcessing\Controller\ToggleCpuMaintenanceController
  methods: [POST]
  requirements:
    action: 'activate|deactivate'

