services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # --- DOMAIN & APPLICATION ---
  App\Taxonomy\Tag\Application\:
    resource: '../../Application/'
    exclude: '../../Application/**/*{Query,Request,Response,Validator}.php'

  # --- INFRASTRUCTURE: PERSISTENCE ---
  App\Taxonomy\Tag\Infrastructure\Persistence\DoctrineTagRepository: ~

  App\Taxonomy\Tag\Domain\Repository\TagRepositoryInterface:
    alias: App\Taxonomy\Tag\Infrastructure\Persistence\DoctrineTagRepository

  App\Taxonomy\Tag\Infrastructure\:
    resource: '../'
    exclude:
      - '../Config/'
      - '../Ui/'
      - '../Persistence/DoctrineTagRepository.php'

  # --- INFRASTRUCTURE: UI (BACKOFFICE HTTP) ---
  App\Taxonomy\Tag\Infrastructure\Ui\Backoffice\Http\Controller\:
    resource: '../Ui/Backoffice/Http/Controller/'
    tags: ['controller.service_arguments']

  App\Taxonomy\Tag\Infrastructure\Ui\Backoffice\Http\Presenter\:
    resource: '../Ui/Backoffice/Http/Presenter/'

  App\Taxonomy\Tag\Infrastructure\Ui\Backoffice\Http\EventSubscriber\:
    resource: '../Ui/Backoffice/Http/EventSubscriber/'

  # --- INFRASTRUCTURE: PERMISSION ---
  App\Taxonomy\Tag\Infrastructure\Security\Permission\TaxonomyPermissionRegister:
    tags: [ 'pumukit.permission_register' ]
