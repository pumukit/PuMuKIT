# Bulk operations (must be before {id} routes)
multimedia_object_bulk_delete:
  path: /admin/backend/multimedia-object/bulk/delete
  controller: App\MultimediaObject\UI\Backend\Controller\BulkDeleteMultimediaObjectController
  methods: [POST]

multimedia_object_bulk_toggle_announce:
  path: /admin/backend/multimedia-object/bulk/toggle-announce
  controller: App\MultimediaObject\UI\Backend\Controller\BulkToggleAnnounceMultimediaObjectController
  methods: [POST]

# Routes with {id} parameter (must be after bulk operations)
multimediaobject_view:
  path: /admin/backend/multimedia-object/{id}/{tab}
  controller: App\MultimediaObject\UI\Backend\Controller\ViewMultimediaObjectController
  defaults:
    tab: 'general'
  requirements:
    tab: general|media|metadata|owners|people|publication|tags

multimediaobject_delete:
  path: /admin/backend/multimedia-object/{id}/delete
  controller: App\MultimediaObject\UI\Backend\Controller\DeleteMultimediaObjectController
  methods: [POST]
