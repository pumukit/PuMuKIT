services:
  App\MultimediaObject\Application\:
    resource: '../../../../Application/*'
    exclude:
      - '../../../../Application/*/*Query.php'
      - '../../../../Application/*/*Request.php'
      - '../../../../Application/*/*Response.php'
    autowire: true
    autoconfigure: true

  App\MultimediaObject\UI\Backoffice\Controller\:
    resource: '../../Controller'
    tags: [ 'controller.service_arguments' ]
    autowire: true
    autoconfigure: true

  App\MultimediaObject\UI\Backoffice\EventSubscriber\:
    resource: '../../EventSubscriber'
    tags: [ 'kernel.event_subscriber' ]
    autowire: true
    autoconfigure: true

  App\MultimediaObject\UI\Backoffice\Presenter\:
    resource: '../../Presenter'
    autowire: true
    autoconfigure: true

  App\MultimediaObject\Domain\Repository\MultimediaObjectRepositoryInterface: '@App\MultimediaObject\Infrastructure\Persistence\DoctrineMultimediaObjectRepository'

  App\MultimediaObject\Infrastructure\Persistence\DoctrineMultimediaObjectRepository:
    autowire: true
    autoconfigure: true
    public: false
    tags: [ 'doctrine.repository' ]
