security:
  providers:
    in_memory:
      memory: ~
    pumukit:
      mongodb: { class: Pumukit\SchemaBundle\Document\User, property: username }

  password_hashers:
    legacy_sha512:
      algorithm: sha512
    legacy_md5:
      algorithm: md5
      iterations: 1
      encode_as_base64: false
    Symfony\Component\Security\Core\User\UserInterface:
      algorithm: auto
      cost: 12
      migrate_from:
        - legacy_sha512
        - legacy_md5

  firewalls:
    api:
      pattern: ^/api
      context: pumukit
      provider: pumukit
      user_checker: Pumukit\SchemaBundle\Security\LoginAttemptUserChecker
      login_throttling:
        max_attempts: 5
        interval: '1 minute'
      http_basic:
        realm:    "secure-api"

    main:
      pattern:   ^/
      provider: pumukit
      context:   pumukit
      custom_authenticators:
        - Pumukit\SchemaBundle\Security\LoginFormAuthenticator
      entry_point: Pumukit\SchemaBundle\Security\LoginFormAuthenticator
      remember_me:
        secret:   '%kernel.secret%'
        lifetime: 604800
        path:     /
      logout:
        path: pumukit_logout

    dev:
      pattern:  ^/(_(profiler|wdt)|css|images|js)/
      security: false

  access_control:
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/resetting, roles: PUBLIC_ACCESS }
    - { path: ^/admin/, roles: [ ROLE_SCOPE_GLOBAL, ROLE_SCOPE_PERSONAL ] }
    - { path: ^/api/, roles: [ ROLE_SCOPE_GLOBAL, ROLE_SCOPE_PERSONAL, ROLE_ACCESS_API ] }

  role_hierarchy:
    ROLE_ADMIN:       ROLE_USER
    ROLE_SUPER_ADMIN: ROLE_ADMIN

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\UserInterface:
        algorithm: auto
        cost: 4
        migrate_from:
          - legacy_sha512
          - legacy_md5
