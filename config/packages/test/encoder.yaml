pumukit_encoder:
  cpus:
    local:
      host: 127.0.0.1
  profiles:
    master_copy:
      display: false
      wizard: true
      master: true
      tags: copy
      resolution_hor: 0
      resolution_ver: 0
      audio: false
      bat: cp "{{input}}" "{{output}}"
      streamserver:
        dir_out: '%kernel.project_dir%/src/Pumukit/EncoderBundle/Tests/Resources/dir_out'
    video_broadcastable:
      generate_pic: false
      display: true
      wizard: true
      master: false
      tags: html5 podcast
      target: PUCHWEBTV PUCHPODCAST
      extension: mp4
      resolution_hor: 0
      resolution_ver: 0
      audio: false
      bat: ffmpeg -y -i "{{input}}" -acodec libfdk_aac -b:a 128k -ac 2 -ar 44100 -vcodec libx264 -preset slow -crf 22 -movflags faststart -threads 0 "{{output}}"
      streamserver:
        dir_out: '%kernel.project_dir%/src/Pumukit/EncoderBundle/Tests/Resources/dir_out'
        url_out: 'http://localhost:8000/downloads/'
