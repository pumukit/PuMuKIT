monolog:
  channels: [ 'deprecation', 'legacy_api', 'frame_ancestors' ]
  handlers:
    legacy_api:
      type: test
      channels: ['legacy_api']
    frame_ancestors:
      type: test
      channels: ['frame_ancestors']
    deprecation:
      type: stream
      path: '%kernel.logs_dir%/deprecation.log'
      bubble: false
      channels: ['deprecation']

    main:
      type: stream
      path: "%kernel.logs_dir%/%kernel.environment%.log"
      level: error
      channels: ['!event', '!deprecation', '!legacy_api', '!frame_ancestors']

    debug_log:
      type: rotating_file
      path: '%kernel.logs_dir%/%kernel.environment%_debug.log'
      level: info
      max_files: '%env(int:PUMUKIT_LOG_MAX_FILES)%'
      channels: ['!event', '!deprecation', '!legacy_api', '!frame_ancestors']
