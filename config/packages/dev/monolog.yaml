monolog:
  channels: [ 'deprecation', 'legacy_api' ]
  handlers:
    legacy_api:
      type: rotating_file
      path: '%kernel.logs_dir%/legacy_api.log'
      level: info
      max_files: 30
      channels: ['legacy_api']
    deprecation:
      type: stream
      path: '%kernel.logs_dir%/deprecation.log'
      bubble: false
      channels: ['deprecation']

    main:
      type: stream
      path: "%kernel.logs_dir%/%kernel.environment%.log"
      level: error
      channels: ['!event', '!deprecation', '!legacy_api']

    debug_log:
      type: rotating_file
      path: '%kernel.logs_dir%/%kernel.environment%_debug.log'
      level: info
      max_files: 20
      channels: ['!event', '!deprecation', '!legacy_api']
