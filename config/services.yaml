parameters:
  pumukit.inspection.command:          ffprobe -v quiet -print_format json -show_format -show_streams {{file}}
  pumukit.picextractor.command:        ffmpeg -ss {{ss}} -y -i {{input}} -r 1 -vframes 1 -s {{size}} -f image2 {{output}}
  pumukit.dynamicpicextractor.command: ffmpeg -i {{input}} -ss 00:00:05 -t 3 -quality 80 -r 10 -s {{width}}x{{height}} {{output}}
  pumukit.warning_on_unpublished:      false
  pumukit.show_dashboard_tab:          true
  pumukit.show_mms_list_all_menu:      false
  pumukit.inbox_depth:                 false
  pumukit.customlanguages:
    - en
  locale:                              "%env(string:PUMUKIT_LOCALE)%"
  secret:                              "%env(string:PUMUKIT_SECRET)%"
  debug_toolbar:                       true
  debug_redirects:                     false
  use_assetic_controller:              true
  router.request_context.scheme:       "%env(string:PUMUKIT_SCHEME)%"
  router.request_context.host:         "%env(string:PUMUKIT_FRONTEND_HOST)%"

  pumukit.info:
    title:               "%env(string:PUMUKIT_TITLE)%"
    description:         "%env(string:PUMUKIT_DESCRIPTION)%"
    keywords:            "%env(string:PUMUKIT_KEYWORDS)%"
    email:               "%env(string:PUMUKIT_EMAIL)%"
    logo:                "%env(string:PUMUKIT_LOGO)%"
    primary_color:       "%env(string:PUMUKIT_PRIMARY_COLOR)%"
    font_color:          "%env(string:PUMUKIT_FONT_COLOR)%"

  pumukit.locales:                     "%env(csv:PUMUKIT_LOCALES)%"
  pumukit.public_dir:                  "%env(string:PUMUKIT_PUBLIC_DIR)%"
  pumukit.storage_dir:                 "%env(string:PUMUKIT_STORAGE_DIR)%"
  pumukit.uploads_dir:                 "%env(string:PUMUKIT_UPLOADS_DIR)%"
  pumukit.uploads_url:                 "%env(string:PUMUKIT_UPLOADS_URL)%"
  pumukit.uploads_material_dir:        "%env(string:PUMUKIT_UPLOADS_MATERIAL_DIR)%"
  pumukit.uploads_material_url:        "%env(string:PUMUKIT_UPLOADS_MATERIAL_URL)%"
  pumukit.uploads_pic_dir:             "%env(string:PUMUKIT_UPLOADS_PIC_DIR)%"
  pumukit.uploads_pic_url:             "%env(string:PUMUKIT_UPLOADS_PIC_URL)%"
  pumukit.inbox:                       "%env(string:PUMUKIT_INBOX)%"
  pumukit.tmp:                         "%env(string:PUMUKIT_TMP)%"
  pumukit.masters_dir:                 "%env(string:PUMUKIT_STORAGE_DIR)%/masters"
  pumukit.downloads_dir:               "%env(string:PUMUKIT_STORAGE_DIR)%/downloads"
  pumukit.downloads_url:               "%env(string:PUMUKIT_SCHEME)%://%env(string:PUMUKIT_FRONTEND_HOST)%/storage/downloads"
  pumukit.delete_on_disk:              "%env(bool:PUMUKIT_DELETE_ON_DISK)%"
  pumukit.copyright_info_url:          "%env(PUMUKIT_COPYRIGHT_INFO_URL)%"
  pumukit.license_info_url:            "%env(PUMUKIT_LICENSE_INFO_URL)%"

pumukit_core:
  inboxUploadURL: "%env(string:PUMUKIT_SCHEME)%://%env(string:PUMUKIT_FRONTEND_HOST)%/tus"

pumukit_youtube:
  playlist_privacy_status: public
  playlists_master: pumukit
  delete_playlists: false
  pub_channels_tags:
    - PUCHYOUTUBE
  sync_status: true
  default_track_upload: youtube
  allowed_caption_mimetypes:
    - vtt
  generate_sbs: true
  upload_removed_videos: false
  sbs_profile_name: sbs
  account_storage: '/srv/pumukit/config/youtube_accounts/stg'

services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true

  # YouTube Quota Check Middleware
  Pumukit\YoutubeBundle\Infrastructure\Middleware\QuotaCheckMiddleware:
    arguments:
      $quotaService: '@Pumukit\YoutubeBundle\Domain\Service\QuotaService'
      $messageBus: '@messenger.bus.default'
      $logger: '@logger'
    tags:
      - { name: 'monolog.logger', channel: 'messenger' }
      - { name: 'messenger.middleware', bus: 'messenger.bus.default', priority: -100 }

  doctrine:
    alias: doctrine_mongodb

  Gedmo\Tree\TreeListener:
    tags:
      - { name: doctrine.event_subscriber, connection: default }
      - { name: doctrine_mongodb.odm.event_subscriber }
    calls:
      - method: setAnnotationReader
        arguments:
          - "@annotation_reader"

  Gedmo\Sortable\SortableListener:
    tags:
      - { name: doctrine.event_subscriber, connection: default }
      - { name: doctrine_mongodb.odm.event_subscriber }
    calls:
      - method: setAnnotationReader
        arguments:
          - '@annotation_reader'
    
  App\Service\:
        resource: '../src/Service'
        autowire: true
        autoconfigure: true

  App\Command\:
        resource: '../src/Command'
        tags: ['console.command']
        autoconfigure: true

  # Commands
  Pumukit\YoutubeBundle\Application\Command\:
        resource: '../src/Pumukit/YoutubeBundle/Application/Command'
        tags: ['console.command']
        bind:
          $projectDir: '%kernel.project_dir%'

  # Message Handlers (Async only - from transport)
  Pumukit\YoutubeBundle\Application\MessageHandler\:
        resource: '../src/Pumukit/YoutubeBundle/Application/MessageHandler'
        exclude:
          - '../src/Pumukit/YoutubeBundle/Application/MessageHandler/WaitingMessageHandler.php'
          - '../src/Pumukit/YoutubeBundle/Application/MessageHandler/EventMessageHandler.php'
          - '../src/Pumukit/YoutubeBundle/Application/MessageHandler/NotificationMessageHandler.php'
        autoconfigure: false
        tags:
          - { name: 'messenger.message_handler', from_transport: 'pumukit.youtube.events' }

  # WaitingMessageHandler (different transport)
  Pumukit\YoutubeBundle\Application\MessageHandler\WaitingMessageHandler:
        autoconfigure: false
        tags:
          - { name: 'messenger.message_handler', from_transport: 'pumukit.youtube.quota.waiting' }

  # Event and Notification handlers (sync - no from_transport)
  Pumukit\YoutubeBundle\Application\MessageHandler\EventMessageHandler: ~
  Pumukit\YoutubeBundle\Application\MessageHandler\NotificationMessageHandler: ~

  # All other YouTube services (auto-discovered)
  Pumukit\YoutubeBundle\:
        resource: '../src/Pumukit/YoutubeBundle/{Application,Domain,Infrastructure}'
        exclude:
          - '../src/Pumukit/YoutubeBundle/Application/Command'
          - '../src/Pumukit/YoutubeBundle/Application/Message'
          - '../src/Pumukit/YoutubeBundle/Application/MessageHandler'
          - '../src/Pumukit/YoutubeBundle/Application/Query/*Query.php'
          - '../src/Pumukit/YoutubeBundle/Domain/Model'
          - '../src/Pumukit/YoutubeBundle/Domain/Exception'
          - '../src/Pumukit/YoutubeBundle/Infrastructure/Controller'

  # Repository alias
  Pumukit\YoutubeBundle\Domain\Repository\PublicationRepositoryInterface:
        alias: Pumukit\YoutubeBundle\Infrastructure\Repository\DoctrinePublicationRepository

  # Controllers need special tag
  Pumukit\YoutubeBundle\Infrastructure\Controller\:
        resource: '../src/Pumukit/YoutubeBundle/Infrastructure/Controller'
        tags: ['controller.service_arguments']
