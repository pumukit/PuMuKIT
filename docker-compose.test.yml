name: pumukit-test

services:
  php:
    env_file:
      - .env.test
    build:
      context: ./
      target: production
      cache_from:
        - teltek/pumukit
        - teltek/nginx
    depends_on:
      - db
      - redis
    volumes:
      - ./:/srv/pumukit

  db:
    image: mongo:9.0

  redis:
    image: valkey/valkey:9.1
    env_file:
      - .env.test
