server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    client_max_body_size 10000m;
    client_body_buffer_size 128k;

    server_name localhost;
    root /srv/pumukit/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block direct access to storage
    location ^~ /storage {
        deny all;
        return 404;
    }

    # Public uploads
    location ^~ /uploads {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Bundles (Symfony assets)
    location ^~ /bundles {
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # WebTV/Admin dynamic CSS/JS (generated by Symfony from Twig)
    location ~* ^/(webtv|admin)/(?:css|js)/ {
        try_files $uri /index.php$is_args$args;
    }

    # Static media: images, fonts, etc (NO videos - must go through /trackfile with tokens)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|css|js|woff|woff2|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
        try_files $uri /index.php$is_args$args;
    }

    # Trackfile routes - MUST validate tokens (WSTG-ATHN-04 protection)
    # Includes m3u8/ts so HLS streams are also routed through the token-validating controller
    location ~* ^/trackfile/.+\.(mp3|mp4|m4v|webm|ogg|flv|mp2|mpeg2|avi|mkv|m3u8|ts|m4a)$ {
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
        proxy_cookie_path / "/; secure; HttpOnly; SameSite=none";
    }

    # PHP-FPM handler
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Deny access to any other .php files
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/pumukit_error.log;
    access_log /var/log/nginx/pumukit_access.log;
}
